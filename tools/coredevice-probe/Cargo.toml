[package]
name = "audiomix-coredevice-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
idevice = { path = "../../research/idevice/idevice", default-features = false, features = ["ring", "usbmuxd", "tcp", "core_device_proxy", "remote_pairing", "tunnel_tcp_stack", "display_stream"] }
